function hInfo(coll,o){const h=o.hist;if(!h||!h.length)return '';const l=h[h.length-1],t=esc(hWho(l)+': '+hAct(l.a)+' em '+fdt(l.d));return `<button class="btn s g keep hinf" style="text-transform:none;margin:0" title="${t}" aria-label="Histórico de atividades" onclick="event.stopPropagation();showHist('${coll}',${o.id})">i</button>`}
function showHist(coll,id){const o=S[coll].find(x=>x.id==id);dlg(`<h3>Histórico de atividades</h3><p class="sub">${esc(o.t||o.assunto||'')}</p>${(o.hist||[]).slice().reverse().map(h=>`<div class="row"><span class="gr"><b>${esc(hWho(h))}</b><div>${esc(hAct(h.a))}</div>${h.m?`<div class="sub">${esc(h.m)}</div>`:''}</span><span class="sub">${fdt(h.d)}</span></div>`).join('')||'<div class="empty">Sem registros</div>'}`,()=>1,'Fechar');const cb=$('#dlg').querySelector('.btn.g');if(cb)cb.style.display='none'}
function logIt(a,r,x){S.log.unshift({u:who()+(whoEmp()&&whoEmp()!==who()?' · '+whoEmp():''),a,r,d:Date.now(),c:(x&&x.cid!=null)?x.cid:nCid(r),i:ME.id,x});S.log=S.log.slice(0,60);save()}

function genPw(){const c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';const a=new Uint32Array(12);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<12;i++)a[i]=Math.floor(Math.random()*4294967296);return Array.from(a,x=>c[x%c.length]).join('')}
async function loadUsers(){if(R!=='admin')return;try{const L=await AUTH.list();if(Array.isArray(L))USERS=L}catch(e){if(e&&e.status===401){try{await sb.auth.signOut({scope:'local'})}catch(_){}toast('Sua sessão expirou. Entre de novo.');setTimeout(()=>location.reload(),1200);return}toast('Não foi possível carregar os usuários: '+(e&&e.message?e.message:'erro desconhecido'))}if(view==='team')render()}

`<div class="card"><h3>Usuários com acesso</h3><div class="sub">Cada pessoa entra com o e-mail e a senha cadastrados aqui. A senha nunca fica visível: se alguém esquecer, use “Redefinir senha”.</div>${[...USERS].sort((a,b)=>((b.role==='admin')-(a.role==='admin'))||((b.id===ME.id)-(a.id===ME.id))).map(u=>{const me=u.id===ME.id;return `<div class="row acc"><span class="gr"><b>${esc(u.nome)}</b>${me?' <span class="bd o">Você</span>':''}${u.ativo?'':' <span class="bd e">Inativo</span>'}<div class="sub em" title="${esc(u.email)}">${esc(u.email)}</div></span><select style="width:auto" ${me?'disabled':''} onchange="setAcc('${u.id}',this.value)">${rl.map(([r,n])=>`<option value="${r}" ${u.role===r?'selected':''}>${n}</option>`).join('')}</select>${u.role==='cliente'?`<select style="width:auto" onchange="setAccC('${u.id}',this.value)">${opts(S.clients).replace(`value="${u.cid}"`,`value="${u.cid}" selected`)}</select>`:''}<button class="btn s g" onclick="renUser('${u.id}')">Editar nome</button><button class="btn s g" onclick="pwUser('${u.id}')">Redefinir senha</button>${u.role==='cliente'?`<button class="btn s g" onclick="resetCli('${u.id}')">Zerar atividade</button>`:''}${me?'':`<button class="btn s g" onclick="togUser('${u.id}')">${u.ativo?'Desativar':'Reativar'}</button><button class="btn s r" onclick="rmAcc('${u.id}')">Remover</button>`}</div>`}).join('')||'<div class="empty">Nenhum usuário cadastrado</div>'}</div>`}
function pwField(id){return `<div style="display:flex;gap:8px"><input id="${id}" type="text" autocomplete="new-password" spellcheck="false" style="flex:1"><button type="button" class="btn s g" onclick="$('#${id}').value=genPw()">Gerar</button></div><p class="sub">Mínimo de 8 caracteres. Copie e envie à pessoa agora: depois de salva, a senha não pode ser vista de novo.</p>`}
function userErr(e){toast(e&&e.message?e.message:'Não foi possível concluir');loadUsers()}
function newUser(){dlg(`<h3>Cadastrar usuário</h3><label>Nome da pessoa (ex.: Juliana Costa)</label><input id="f1" autocomplete="off"><label>E-mail (será o login)</label><input id="f2" type="email" autocomplete="off"><label>Perfil</label><select id="f3" onchange="document.getElementById('fc').style.display=this.value==='cliente'?'block':'none'">${Object.keys(ROLES).map(r=>`<option value="${r}">${ROLES[r]}</option>`).join('')}</select><div id="fc" style="display:none"><label>Empresa do cliente (a conta é desta pessoa, ligada a esta empresa)</label><select id="f4">${opts(S.clients)}</select></div><label>Senha inicial</label>${pwField('f5')}`,()=>{const nome=$('#f1').value.trim(),email=$('#f2').value.trim().toLowerCase(),role=$('#f3').value,senha=$('#f5').value;
if(!nome)return toast('Informe o nome');if(!EMRE.test(email))return toast('Informe um e-mail válido');if(USERS.some(u=>u.email===email))return toast('Já existe um usuário com este e-mail');if(senha.length<8)return toast('A senha precisa ter ao menos 8 caracteres');if(role==='cliente'&&!S.clients.length)return toast('Cadastre um cliente antes');
AUTH.createUser({nome,email,senha,role,cid:role==='cliente'?+$('#f4').value:null}).then(()=>{logIt('cadastrou usuário '+nome,ROLES[role]);return loadUsers()}).then(()=>{toast('Usuário cadastrado');render()}).catch(userErr);return 1},'Cadastrar')}
function renUser(id){const u=USERS.find(x=>x.id===id);if(!u)return;dlg(`<h3>Editar nome</h3><p class="sub">${esc(u.email)}</p><label>Nome da pessoa</label><input id="f1" value="${esc(u.nome)}">`,()=>{const nome=$('#f1').value.trim();if(!nome)return toast('Informe o nome');AUTH.update(id,{nome}).then(()=>{logIt('alterou o nome de '+u.nome,nome);return loadUsers()}).then(()=>{toast('Nome atualizado');render()}).catch(userErr);return 1},'Salvar')}
function pwUser(id){const u=USERS.find(x=>x.id===id);if(!u)return;dlg(`<h3>Redefinir senha</h3><p class="sub">${esc(u.nome)} · ${esc(u.email)}</p><label>Nova senha</label>${pwField('f1')}`,()=>{const s=$('#f1').value;if(s.length<8)return toast('A senha precisa ter ao menos 8 caracteres');AUTH.setPassword(id,s).then(()=>{logIt('redefiniu senha de '+u.nome,'');toast('Senha redefinida')}).catch(userErr);return 1},'Salvar senha')}
function setAcc(id,role){const u=USERS.find(x=>x.id===id);if(!u)return;AUTH.update(id,{role,cid:role==='cliente'?(u.cid||(S.clients[0]||{}).id||null):null}).then(()=>{logIt('definiu acesso de '+u.nome,ROLES[role]);return loadUsers()}).then(()=>render()).catch(userErr)}
function setAccC(id,c){AUTH.update(id,{cid:+c}).then(()=>loadUsers()).catch(userErr)}
function togUser(id){const u=USERS.find(x=>x.id===id);if(!u)return;AUTH.update(id,{ativo:!u.ativo}).then(()=>{logIt((u.ativo?'desativou':'reativou')+' usuário',u.nome);return loadUsers()}).then(()=>render()).catch(userErr)}
function rmAcc(id){const u=USERS.find(x=>x.id===id);if(!u)return;dlg(`<h3>Remover usuário</h3><p>Remover o acesso de ${esc(u.nome)}? A pessoa não conseguirá mais entrar.</p>`,()=>{AUTH.remove(id).then(()=>{logIt('removeu usuário',u.nome);return loadUsers()}).then(()=>render()).catch(userErr);return 1},'Remover')}
const dleft=f=>Math.round((new Date(f)-new Date(D()))/864e5);
const alertT=n=>[7,15,30,60].find(t=>n<=t);
function ctSt(k){if(k.st==='Encerrado')return 'Encerrado';if(k.tipo==='Pontual')return dleft(k.fim)>=0?'Agendado':'Realizado';return dleft(k.fim)<=60?'Próximo do vencimento':'Ativo'}
const ctSuf=k=>k.tipo==='Anual'?'/ano':k.tipo==='Pontual'?'':'/mês';
function contr(){const L=['Todos','A vencer','Encerrados'],ct=sget('contr',L);return hdr('Contratos')+ctStrip()+stab('contr',L)+`<div class="card">${S.contracts.filter(k=>ct==='Todos'||(ct==='Encerrados'?k.st==='Encerrado':k.st!=='Encerrado'&&k.tipo!=='Pontual'&&dleft(k.fim)<=60)).map(k=>{const n=dleft(k.fim),st=ctSt(k),a=st!=='Encerrado'&&k.tipo!=='Pontual'&&alertT(n);return `<div class="row"><span class="gr"><b>${esc(cl(k.cid).nome)}</b><div class="sub">${esc(k.serv)} · ${esc(k.tipo||'Mensal')} · ${money(k.v)}${ctSuf(k)} · ${k.pgto?esc(k.pgto):'Pagamento a definir'}${k.pid&&P_(k.pid)&&P_(k.pid).num?' · Proposta nº '+esc(P_(k.pid).num):''}<br>${k.tipo==='Pontual'?fd(k.ini):fd(k.ini)+' a '+fd(k.fim)}</div></span>${a?`<span class="bd e">${n<0?'Vencido há '+(-n)+' d':'Vence em '+n+' d'}</span>`:''}<span class="bd ${st==='Ativo'||st==='Realizado'?'o':st==='Encerrado'||st==='Agendado'?'':'w'}">${st}</span>${st!=='Encerrado'&&k.tipo!=='Pontual'?`<button class="btn s g" onclick="renew(${k.id})">Renovar 12 meses</button><button class="btn s g" onclick="endC(${k.id})">Encerrar</button>`:''}${k.pid&&P_(k.pid)?`<button class="btn s g" onclick="printProp(${k.pid})">Ver proposta</button>`:''}${attBtn('contracts',k.id)}${ebtn('contracts',k.id)}</div>`}).join('')||'<div class="empty">Sem contratos. Eles aparecem aqui quando você aprova uma proposta.</div>'}</div>`}
function renew(id){const k=S.contracts.find(x=>x.id==id),d=new Date(k.fim);d.setFullYear(d.getFullYear()+1);k.fim=d.toISOString().slice(0,10);const c=S.clients.find(x=>x.id==k.cid);if(c)c.renov=k.fim;logIt('renovou contrato',cl(k.cid).nome);toast('Contrato renovado até '+fd(k.fim));render()}
function endC(id){const k=S.contracts.find(x=>x.id==id);dlg(`<h3>Encerrar contrato</h3><p>Encerrar o contrato de ${esc(cl(k.cid).nome)}? O cliente passa a Encerrado.</p>`,()=>{k.st='Encerrado';const c=S.clients.find(x=>x.id==k.cid);if(c)c.status='Encerrado';logIt('encerrou contrato',cl(k.cid).nome);return 1},'Encerrar')}

const addY=(s,n)=>{const d=new Date(s+'T12:00:00');d.setFullYear(d.getFullYear()+n);return d.toISOString().slice(0,10)};
function ctTipo(only){const t=$('#f0').value,pt=t==='Pontual';$('#lv').textContent=t==='Mensal'?'Valor mensal (R$)':t==='Anual'?'Valor anual (R$)':'Valor do serviço (R$)';$('#li').textContent=pt?'Data do serviço':'Início';$('#cf').style.display=pt?'none':'block';const ini=$('#f4').value||D();$('#f5').value=pt?ini:addY(ini,1);if(!only){const pg=$('#f6');}}
function newContr(){dlg(`<h3>Novo contrato</h3><label>Tipo de contrato</label><select id="f0" onchange="ctTipo()"><option value="Mensal">Mensal (cobrança todo mês)</option><option value="Anual">Anual</option><option value="Pontual">Pontual (um dia só)</option></select><label>Cliente</label><select id="f1">${opts(S.clients)}</select><label>Serviço</label><input id="f2"><label id="lv">Valor mensal (R$)</label><input id="f3" type="number"><label id="li">Início</label><input id="f4" type="date" value="${D()}" onchange="ctTipo(1)"><div id="cf"><label>Final</label><input id="f5" type="date" value="${addY(D(),1)}"></div><label>Forma de pagamento</label><input id="f6" placeholder="Ex.: Boleto mensal, Pix, cartão">${attHtml()}`,()=>{const t=$('#f0').value,v=+$('#f3').value,ini=$('#f4').value,fim=t==='Pontual'?ini:$('#f5').value;if(!$('#f2').value.trim()||!v)return toast('Informe serviço e valor');if(!ini||!fim)return toast('Informe as datas');if(fim<ini)return toast('A data final não pode ser antes do início');const mk=a=>{S.contracts.push({id:nid(),cid:+$('#f1').value,serv:$('#f2').value,tipo:t,v,ini,fim,pgto:$('#f6').value,st:'Ativo',...attPack(a)});logIt('criou contrato '+t.toLowerCase(),cl($('#f1').value).nome);toast('Contrato criado')};return attTake(mk)})}

const pst=p=>['Enviada','Visualizada'].includes(p.st)&&p.val<D()?'Expirada':p.st;
function pAct(p,st){const b=(l,f,pr)=>`<button class="btn s${pr?'':' g'}" onclick="${f}(${p.id})">${l}</button>`;let h='';h=b('Imprimir','printProp');if(st!=='Aprovada')h+=b('Editar','newProp');if(st==='Rascunho')h+=b('Enviar','pSend',1);if(st==='Expirada')h=b('Reabrir','pReopen');if(st==='Enviada')h+=b('Visualizada','pView');if(st==='Rascunho'||st==='Enviada'||st==='Visualizada')h+=b('Aprovar','pOkAsk',1)+b('Recusar','pNo');return h}
function prop(){const L=['Todas','Em aberto','Fechadas'],pt=sget('prop',L);return hdr('Propostas','<button class="btn" onclick="newProp()">+ Nova proposta</button>')+prStrip()+stab('prop',L)+`<div class="card">${S.props.filter(p=>pst(p)!=='Aprovada').filter(p=>{const o=['Rascunho','Enviada','Visualizada'].includes(pst(p));return pt==='Todas'||(pt==='Em aberto'?o:!o)}).map(p=>{const st=pst(p);return `<div class="row"><span class="gr"><b>${esc(p.nome)}</b><div class="sub">${esc(p.emp)} · ${money(ptotal(p))}${pSuf(p)} · Validade ${fd(p.val)}</div></span><span class="bd ${st==='Aprovada'?'o':st==='Recusada'||st==='Expirada'?'e':st==='Rascunho'?'':'w'}">${st}</span><button class="btn s g" onclick="seeProp(${p.id})">Ver</button>${pAct(p,st)}${attBtn('props',p.id)}${dbtn('props',p.id)}</div>`}).join('')||'<div class="empty">Nenhuma proposta</div>'}</div>`}

 const M=fcl(mine(S.meetings)).filter(m=>nx?(!m.done&&m.data>=D()):(m.done||m.data<D())).sort((a,b)=>nx?a.data.localeCompare(b.data):b.data.localeCompare(a.data));
 return hdr('Reuniões',adm?'<button class="btn" onclick="newMeet()">+ Nova reunião</button>':'')+mtStrip()+stab('meet',['Próximas','Histórico'])+cfSel()+`<div class="card">${M.map(m=>`<div class="row"><span class="gr"><b>${esc(m.t)}</b><div class="sub">${esc(cl(m.cid).nome)} · ${fd(m.data)}${m.hora?' às '+esc(m.hora):''}</div></span>${m.ata?'<span class="bd o">Com ata</span>':''}<button class="btn s g" onclick="openMeet(${m.id})">${adm?'Abrir':'Ver'}</button>${ebtn('meetings',m.id)}</div>`).join('')||'<div class="empty">Nenhuma reunião aqui</div>'}</div>`}
function newMeet(){dlg(`<h3>Nova reunião</h3><label>Cliente</label><select id="f1">${opts(S.clients)}</select><label>Título</label><input id="f2"><label>Data</label><input id="f3" type="date" value="${addD(2)}"><label>Horário</label><input id="f4" type="time" value="10:00"><label>Link</label><input id="f5" placeholder="https://"><label>Participantes</label><input id="f6"><label>Pauta</label><textarea id="f7" rows="2"></textarea>`,()=>{const t=$('#f2').value.trim(),u=$('#f5').value.trim();if(!t)return toast('Informe o título');if(u&&!okUrl(u))return toast('O link deve começar com https://');S.meetings.push({id:nid(),cid:+$('#f1').value,t,data:$('#f3').value,hora:$('#f4').value,link:u,part:$('#f6').value,pauta:$('#f7').value,ata:'',dec:'',done:false,hist:nH('agendou a reunião')});logIt('agendou reunião',t,{k:'meet',cid:+$('#f1').value,dt:$('#f3').value,hr:$('#f4').value});toast('Reunião agendada');return 1})}
function openMeet(id){const m=S.meetings.find(x=>x.id==id),lk=m.link&&okUrl(m.link)?`<a href="${esc(m.link)}" target="_blank" rel="noopener" style="color:var(--ac)">Entrar na reunião</a>`:'';
 const head=`<h3>${esc(m.t)}</h3><p class="sub">${esc(cl(m.cid).nome)} · ${fd(m.data)}${m.hora?' às '+esc(m.hora):''}${m.part?'<br>Participantes: '+esc(m.part):''}</p>${lk}`;
 if(S.role!=='admin')return dlg(head+`<label>Pauta</label><p>${esc(m.pauta||'—')}</p><label>Ata</label><p>${esc(m.ata||'Ainda sem ata.')}</p><label>Decisões</label><p>${esc(m.dec||'—')}</p>`,()=>1,'Fechar');
 dlg(head+`<label>Pauta</label><textarea id="f1" rows="2">${esc(m.pauta||'')}</textarea><label>Ata</label><textarea id="f2" rows="3">${esc(m.ata||'')}</textarea><label>Decisões</label><textarea id="f3" rows="2">${esc(m.dec||'')}</textarea><label>Tarefas a criar (uma por linha)</label><textarea id="f4" rows="3"></textarea><label>Responsável pelas tarefas</label><input id="f5" value="${esc(cl(m.cid).resp||'')}">`,()=>{m.pauta=$('#f1').value;m.ata=$('#f2').value;m.dec=$('#f3').value;if(m.ata.trim())m.done=true;const ls=$('#f4').value.split('\n').map(x=>x.trim()).filter(Boolean);ls.forEach(l=>S.tasks.push({id:nid(),t:l,cid:m.cid,pid:(S.projects.find(p=>p.cid==m.cid)||{}).id,resp:$('#f5').value||cl(m.cid).resp,prazo:addD(3),st:'A fazer',mid:m.id}));logIt(ls.length?'salvou ata e criou '+ls.length+' tarefa(s)':'atualizou reunião',m.t);toast(ls.length?ls.length+' tarefa(s) criada(s)':'Reunião salva');return 1},'Salvar ata')}

 const pre=(S.role==='cliente'&&PCID())?String(PCID()):'equipe',nm=String(f.name||'arquivo').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w.\-]+/g,'_').slice(-80),id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now()+''+Math.random().toString(16).slice(2)),path=pre+'/'+id+'/'+nm;
 const{error}=await sb.storage.from('arquivos').upload(path,f,{contentType:f.type||'application/octet-stream',upsert:false});if(error)throw error;
 return sb.storage.from('arquivos').getPublicUrl(path).data.publicUrl}catch(e){return null}}

 return `<style>@page{size:A4;margin:0}.pws{height:0}@media print{.pws{height:14mm}}.pdoc table{border-collapse:collapse}.pdoc tr,.pk{break-inside:avoid;page-break-inside:avoid}.pdoc,.pdoc *{-webkit-print-color-adjust:exact;print-color-adjust:exact}@media print{.pdoc{padding:0 14mm!important;max-width:none!important}}</style><table class="pw" style="width:100%;border-collapse:collapse"><thead><tr><td class="pws" style="padding:0"></td></tr></thead><tfoot><tr><td class="pws" style="padding:0"></td></tr></tfoot><tbody><tr><td style="padding:0"><div class="pdoc" style="max-width:780px;margin:0 auto;padding:48px 40px;font-family:'Space Grotesk',system-ui,sans-serif;color:#111;line-height:1.5;font-size:14px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid #111;padding-bottom:18px"><div>${LOGOP?`<img alt="${ag}" src="${LOGOP}" style="height:46px;width:auto;display:block">`:`<div style="font-size:30px;font-weight:600;letter-spacing:-.03em">${ag}</div>`}<div style="font-size:12px;color:${g6};margin-top:8px">${info}</div></div><div style="text-align:right"><div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:${g6}">Proposta comercial</div>${p.num?`<div style="font-size:20px;font-weight:600">Nº ${esc(p.num)}</div>`:''}<div style="font-size:12px;color:${g6};margin-top:4px">${p.emit?'Emitida em '+fd(p.emit)+'<br>':''}Válida até ${fd(p.val)}</div></div></div>${p.titulo?`<h1 style="font-size:28px;letter-spacing:-.03em;margin:28px 0 0;line-height:1.15">${esc(p.titulo)}</h1>`:''}<div class="pk" style="margin-top:22px;background:#f6f6f6;border-radius:8px;padding:14px 16px"><div style="font-size:12px;color:${g6}">Preparada para</div><div style="font-size:20px;font-weight:600">${esc(p.nome)}</div><div style="color:${g6}">${esc(p.emp||'')}${cli?'<br>'+cli:''}</div></div>${sec('Apresentação',tx(p.intro))}${sec('Objetivo',tx(p.obj))}${sec('Escopo',tx(p.escopo))}${sec('Investimento',`<table style="width:100%;font-size:14px"><tr>${th('Serviço')}${th('Qtd',1)}${th('Valor',1)}${th('Total',1)}</tr>${p.itens.map(i=>`<tr><td style="${td}"><b>${esc(i.d)}</b>${i.det?`<div style="font-size:12.5px;color:${g6};white-space:pre-wrap">${esc(i.det)}</div>`:''}</td><td style="${td};text-align:right">${i.q}</td><td style="${td};text-align:right">${mD(i.v)}</td><td style="${td};text-align:right">${mD(i.q*i.v)}</td></tr>`).join('')}</table><div class="pk" style="text-align:right;margin-top:14px">Subtotal ${mD(sub)}${p.desc?`<br>Desconto ${p.desc}%: -${mD(sub-tot)}`:''}<div style="font-size:26px;font-weight:600;margin-top:6px">Total ${mD(tot)}${suf}</div><div style="font-size:12px;color:${g6}">${cob}</div></div>`)}${sec('Pagamento',p.forma||p.pag?(p.forma?`<div><b>Formas:</b> ${esc(p.forma)}</div>`:'')+tx(p.pag):'')}${sec('O que não está incluso',tx(p.excl))}${sec('Responsabilidades do cliente',tx(p.cresp))}${sec('Condições gerais',tx(p.cond))}${sec('Próximos passos',tx(p.prox))}<div class="pk" style="margin-top:46px"><div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:${g6}">Aceite</div><p style="margin:6px 0 0;font-size:13px;color:${g6}">Ao assinar abaixo, o cliente aprova esta proposta nas condições descritas.</p><div style="display:flex;gap:40px;margin-top:56px"><div style="flex:1;border-top:1px solid #111;padding-top:6px;font-size:13px">${ag}${p.por?'<br>'+esc(p.por):''}</div><div style="flex:1;border-top:1px solid #111;padding-top:6px;font-size:13px">${esc(p.nome)}${p.emp&&p.emp!==p.nome?'<br>'+esc(p.emp):''}</div></div><div style="margin-top:22px;font-size:13px;color:${g6};display:flex;align-items:flex-end;gap:8px;max-width:440px"><span>Local e data:</span><span style="flex:1;border-bottom:1px solid #111;height:1px"></span></div></div></div></td></tr></tbody></table>`}
function printProp(id){const p=P_(id);let e=document.getElementById('pp');if(e)e.remove();e=document.createElement('div');e.id='pp';e.innerHTML=`<div class="noprint" style="position:sticky;top:0;background:#111;padding:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" style="background:#fff;color:#111" onclick="window.print()">Imprimir / salvar PDF</button><button class="btn g" onclick="dlProp(${id})">Baixar HTML</button><button class="btn g" onclick="document.getElementById('pp').remove()">Fechar</button></div>`+propDoc(p);document.body.appendChild(e)}
async function dlProp(id){const p=P_(id);try{await saveFile({filename:'proposta-'+p.nome.replace(/[^\w-]+/g,'-')+'.html',data:'<!doctype html><meta charset="utf-8"><title>Proposta</title>'+propDoc(p)});toast('Proposta salva')}catch(e){toast('Download cancelado')}}
(()=>{['dragover','drop'].forEach(t=>document.addEventListener(t,e=>{const dt=e.dataTransfer;if(!dt||!Array.from(dt.types||[]).includes('Files'))return;e.preventDefault();
 if(t==='drop'){const i=document.querySelector('#dlg input[type=file]');if(i&&dt.files.length&&e.target.closest&&e.target.closest('#dlg')){i.files=dt.files;i.dispatchEvent(new Event('change'))}}}))})();
/* ===== Conteúdo único: histórico e Feed Preview ===== */
function histC(id){const c=S.contents.find(x=>x.id==id),h=(c.hist||[]).slice().reverse();dlg(`<h3>Histórico</h3><p class="sub">${esc(c.t)}</p><div class="upl">${h.map(l=>`<div class="upi"><div class="upn"><b>${esc(hAct(l.a))}</b><span>${esc(hWho(l))} · ${fdt(l.d)}</span></div></div>`).join('')||'<div class="empty">Sem registros ainda</div>'}</div>`,()=>1,'Fechar')}
let FV='Feed';
const fvT={Feed:['Feed','Post','Carrossel'],Reels:['Reel'],Stories:['Story']};
/* Feed Preview tem os próprios itens (S.feed): cada conteúdo concluído gera uma cópia. Apagar em Conteúdos/Tarefas não mexe aqui; só dá para remover dentro do próprio Feed Preview. */
function feedSync(){if(S.role!=='admin')return;S.feed=S.feed||[];const F=S.feed,cp=(o,c)=>{['cid','t','tipo','data','hora','leg','cta','tags'].forEach(k=>o[k]=c[k]);attSet(o,attList(c).slice())};
 (S.contents||[]).forEach(c=>{const f=F.find(x=>x.src==c.id);if(f){cp(f,c);c.fed=true}else if(c.st==='Concluído'&&!c.fed){const o={id:nid(),src:c.id,st:'Concluído'};cp(o,c);if(c.pos!=null)o.pos=c.pos;F.push(o);c.fed=true}})}
function feedDel(id){const f=(S.feed||[]).find(x=>x.id==id);if(!f)return;dlg(`<h3>Remover do Feed Preview</h3><p><b>${esc(f.t)}</b></p><p class="sub">Isso remove só do Feed Preview. O conteúdo em Conteúdos não é afetado.</p>`,()=>{S.feed=S.feed.filter(x=>x.id!=id);logIt('removeu do Feed Preview',f.t);toast('Removido do Feed Preview');return 1},'Remover')}
function feedItems(c){const img=x=>attList(x).find(a=>fk(a.u)==='img'),ok=x=>x.cid==c.id&&fvT[FV].includes(x.tipo)&&(x.apr||x.st==='Agendado'||x.st==='Concluído')&&x.st!=='Ajustes';
 return feedSrc().filter(ok).map(x=>({x,im:img(x)})).filter(o=>o.im||FV!=='Feed').sort((a,b)=>(b.x.pos!=null&&a.x.pos!=null?a.x.pos-b.x.pos:((b.x.data||'')+(b.x.hora||'')).localeCompare((a.x.data||'')+(a.x.hora||''))))}
function feedTab(c){const L=feedItems(c),adm=S.role==='admin';
 return `<div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center">${Object.keys(fvT).map(k=>`<button class="btn s ${k===FV?'':'g'}" onclick="FV='${k}';render()">${k}</button>`).join('')}${adm?`<button class="btn s g" style="margin-left:auto" onclick="feedCsv(${c.id})">Exportar CSV</button>`:''}</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:3px;max-width:480px">${L.map((o,i)=>`<div style="position:relative;aspect-ratio:4/5;background:var(--acs);overflow:hidden;cursor:pointer" onclick="feedOpen(${o.x.id})" title="Ver legenda">${o.im?`<img src="${esc(o.im.u)}" alt="" style="width:100%;height:100%;object-fit:cover">`:`<div class="sub" style="padding:8px;font-size:11px">${esc(o.x.t)}</div>`}<span class="bd" style="position:absolute;left:4px;top:4px;font-size:10px;padding:1px 6px;background:var(--sf)">${o.x.st==='Concluído'?'Publicado':o.x.data?fd(o.x.data)+(o.x.hora?' '+esc(o.x.hora):''):'Aprovado'}</span>${(n=>n>1?`<span class="bd" style="position:absolute;left:4px;bottom:4px;font-size:10px;padding:1px 6px;background:var(--sf)">${n} fotos</span>`:'')(attList(o.x).filter(a=>fk(a.u)==='img').length)}${adm?`<button class="upx" style="position:absolute;right:2px;top:2px;width:24px;height:24px;background:var(--sf)" onclick="event.stopPropagation();feedDel(${o.x.id})" aria-label="Remover do Feed Preview" title="Remover do Feed Preview">✕</button><span style="position:absolute;right:2px;bottom:2px;display:flex;gap:2px"><button class="upx" style="width:24px;height:24px;background:var(--sf)" onclick="event.stopPropagation();feedMv(${o.x.id},-1)" aria-label="Mover antes">←</button><button class="upx" style="width:24px;height:24px;background:var(--sf)" onclick="event.stopPropagation();feedMv(${o.x.id},1)" aria-label="Mover depois">→</button></span>`:''}</div>`).join('')}</div>${L.length?'':'<div class="empty">Nada para mostrar ainda. Aprove um conteúdo com arte para ele aparecer aqui.</div>'}`}
let FO={id:0,L:[],i:0,x:0};
function feedShow(){const im=$('#fo_img');if(!im)return;const n=FO.L.length,q=(k,v)=>{const e=$(k);if(e)e.style.visibility=v?'visible':'hidden'};im.src=FO.L[FO.i].u;q('#fo_p',FO.i>0);q('#fo_n',FO.i<n-1);const c=$('#fo_c');if(c)c.textContent=(FO.i+1)+'/'+n;document.querySelectorAll('#fo_dots i').forEach((d,k)=>d.style.opacity=k===FO.i?1:.3)}
function feedNav(d){const j=FO.i+d;if(j<0||j>=FO.L.length)return;FO.i=j;feedShow()}
document.addEventListener('keydown',e=>{if(!$('#fo_img')||!$('#dlg').open)return;if(e.key==='ArrowRight')feedNav(1);else if(e.key==='ArrowLeft')feedNav(-1)});
function feedOpen(id){const c=feedSrc().find(x=>x.id==id);if(!c)return;const ims=attList(c).filter(a=>fk(a.u)==='img'),n=ims.length,L=(l,v)=>v?`<label>${l}</label><div style="white-space:pre-wrap;color:var(--tx);overflow-wrap:anywhere">${esc(v)}</div>`:'';
 FO={id,L:ims,i:0,x:0};
 const ab='position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:var(--sf);font-size:20px;line-height:1',
 pic=n?`<div style="position:relative;margin:0 auto 6px;max-width:100%;touch-action:pan-y" ontouchstart="FO.x=event.touches[0].clientX" ontouchend="const d=event.changedTouches[0].clientX-FO.x;if(Math.abs(d)>40)feedNav(d<0?1:-1)"><img id="fo_img" src="${esc(ims[0].u)}" alt="" style="display:block;max-width:100%;max-height:50vh;margin:0 auto;object-fit:contain">${n>1?`<button class="upx" id="fo_p" style="${ab};left:4px;visibility:hidden" onclick="feedNav(-1)" aria-label="Foto anterior">‹</button><button class="upx" id="fo_n" style="${ab};right:4px" onclick="feedNav(1)" aria-label="Próxima foto">›</button><span class="bd" id="fo_c" style="position:absolute;right:6px;top:6px;font-size:11px;background:var(--sf)">1/${n}</span>`:''}</div>${n>1?`<div id="fo_dots" style="display:flex;gap:5px;justify-content:center;margin-bottom:8px">${ims.map((_,k)=>`<i style="width:6px;height:6px;border-radius:50%;background:var(--tx);opacity:${k?.3:1}"></i>`).join('')}</div>`:''}`:'';
 dlg(`<h3>${esc(c.t)}</h3><p class="sub">${esc(c.tipo)}${c.data?' · '+fd(c.data):''}${c.hora?' às '+esc(c.hora):''} · ${c.st==='Concluído'?'Publicado':esc(c.st)}</p>${pic}${L('Legenda',c.leg)||'<div class="empty">Sem legenda</div>'}${L('CTA',c.cta)}${L('Hashtags',c.tags)}`,()=>1,'Fechar');
 const cb=$('#dlg').querySelector('.btn.g');if(cb)cb.style.display='none'}
async function feedCsv(cid){const c=S.clients.find(x=>x.id==cid),q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',L=(S.feed||[]).filter(x=>x.cid==cid).sort((a,b)=>(a.data||'').localeCompare(b.data||''));
 if(!L.length)return toast('Nenhum conteúdo publicado para exportar');
 const rows=[['Título','Tipo','Data'].map(q).join(';'),...L.map(x=>[x.t,x.tipo,x.data?fd(x.data):''].map(q).join(';'))];
 try{await saveFile({filename:'conteudos-publicados-'+String(c?c.nome:'cliente').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.csv',data:'\ufeff'+rows.join('\r\n')});toast(L.length+' título(s) exportado(s)')}catch(e){toast('Exportação cancelada')}}
function feedMv(id,d){const c=S.clients.find(x=>x.id==((S.feed||[]).find(y=>y.id==id)||{}).cid),L=feedItems(c),i=L.findIndex(o=>o.x.id==id),j=i+d;if(j<0||j>=L.length)return;L.forEach((o,k)=>o.x.pos=k);const t=L[i].x.pos;L[i].x.pos=L[j].x.pos;L[j].x.pos=t;hist(L[i].x,'ajustou a posição no feed');save();render()}

/* Feed Preview na conta do cliente: mesma grade da agência, só leitura. Se o servidor não entregar S.feed ao cliente, usa os conteúdos concluídos dele. */
const feedSrc=()=>S.feed||(S.role!=='admin'?(S.contents||[]).filter(x=>x.st==='Concluído'):[]);
function feedView(){const c=S.clients.find(x=>x.id==PCID());return hdr('Feed Preview')+(c?`<p class="sub" style="margin:-4px 0 12px">Veja como o seu feed está ficando. Toque em uma publicação para ler a legenda.</p>`+feedTab(c):'<div class="empty">Nenhum cliente vinculado a esta conta. Fale com a agência.</div>')}

boot();
</script></body></html>
